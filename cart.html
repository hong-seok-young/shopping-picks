<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#d62828"><link rel="apple-touch-icon" href="icons/i190-apple-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="190"><script src="pwa.js"></script><script src="sync.js"></script><script src="cart.js" defer></script>
<title>장바구니</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#eef0f3;--surface:#fff;--fg:#1b2030;--muted:#5d6577;--line:#d6dae2;--accent:#2e3f6e;--soft:#e1e6f2;--good:#2f7a4f;--bad:#a23b3b;
  --display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151c;--surface:#1b1f29;--fg:#e6e9f0;--muted:#9aa2b4;--line:#2c3240;--accent:#9db0e6;--soft:#262f47;--good:#6cc493;--bad:#e88080;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--surface:#1b1f29;--fg:#e6e9f0;--muted:#9aa2b4;--line:#2c3240;--accent:#9db0e6;--soft:#262f47;--good:#6cc493;--bad:#e88080;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:13px;line-height:1.4;margin:0;padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:8px;min-height:30px;padding-right:72px}
header a{color:var(--accent);text-decoration:none;font-weight:700}
h1{font-family:var(--display);font-size:17px;margin:0}
.sum{display:flex;justify-content:space-between;align-items:baseline;background:var(--soft);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-weight:700}
.sum em{font-style:normal;font-family:var(--mono);font-size:16px;color:var(--accent)}
h2{font-size:11px;font-weight:700;color:var(--muted);margin:4px 2px 0}
.row{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px}
.row img,.row .noimg{width:46px;height:60px;border-radius:6px;object-fit:cover;flex:none;background:var(--line)}
.row .i{flex:1;min-width:0}
.row .br{font-size:10.5px;color:var(--muted)}
.row .nm{font-weight:700;font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .mt{font-size:11px;color:var(--muted)}.row .mt b{color:var(--fg);font-size:12.5px}
.row .b{display:flex;flex-direction:column;gap:4px;flex:none}
.row .b a,.row .b button{font:inherit;font-size:11px;font-weight:700;border-radius:6px;padding:5px 8px;text-align:center;text-decoration:none;cursor:pointer}
.row .b a{color:var(--surface);background:var(--accent);border:0}
.row .b button{color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
</style>
<div class="wrap">
  <header><a href="./">←</a><h1>장바구니</h1></header>
  <div class="sum"><span id="cnt">0개</span><em id="tot">0원</em></div>
  <div id="list"></div>
</div>
<script>
(function(){
  var CAT={'knit.html':'니트','final-two.html':'니트','turtleneck.html':'목폴라','sweat.html':'맨투맨','hoodie.html':'후드티','longsleeve.html':'긴팔티','shirts.html':'셔츠','coat.html':'코트','outer.html':'아우터','cardigan.html':'가디건','innerouter.html':'가디건','pants.html':'바지','gym.html':'헬스'};
  var ORDER=['니트','목폴라','맨투맨','후드티','긴팔티','셔츠','코트','아우터','가디건','바지','헬스','기타'];
  function esc(t){return String(t||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function load(){try{return JSON.parse(localStorage.getItem('sp:'+(window.spUserNS||'')+'cart')||'{}')}catch(e){return{}}}
  function draw(){
    var c=load(),items=Object.keys(c).map(function(k){return c[k]}),L=document.getElementById('list');
    var tot=items.reduce(function(a,b){return a+(b.price||0)},0);
    document.getElementById('cnt').textContent=items.length+'개';
    document.getElementById('tot').textContent=tot.toLocaleString('ko-KR')+'원';
    if(!items.length){L.innerHTML='<p class="empty">담은 상품이 없어요. 상품 카드의 🛒를 누르면 여기에 모여요.</p>';return}
    var g={};items.forEach(function(it){var k=CAT[it.page]||'기타';(g[k]=g[k]||[]).push(it)});
    L.innerHTML=ORDER.filter(function(k){return g[k]}).map(function(k){
      var sub=g[k].reduce(function(a,b){return a+(b.price||0)},0);
      return '<h2>'+k+' · '+g[k].length+'개 · '+sub.toLocaleString('ko-KR')+'원</h2>'+g[k].sort(function(a,b){return a.t-b.t}).map(function(it){
        return '<div class="row">'+(it.img?'<img src="'+esc(it.img)+'" alt="" loading="lazy">':'<div class="noimg"></div>')+
          '<div class="i"><div class="br">'+esc(it.brand)+'</div><div class="nm">'+esc(it.name)+'</div><div class="mt">'+(it.size?esc(it.size)+' · ':'')+'<b>'+(it.price||0).toLocaleString('ko-KR')+'원</b></div></div>'+
          '<div class="b"><a href="https://www.musinsa.com/products/'+esc(it.id)+'" target="_blank" rel="noopener">무신사</a><button type="button" data-id="'+esc(it.id)+'">빼기</button></div></div>';
      }).join('');
    }).join('');
  }
  document.addEventListener('click',function(e){var b=e.target.closest('button[data-id]');if(!b)return;var c=load();delete c[b.dataset.id];try{localStorage.setItem('sp:'+(window.spUserNS||'')+'cart',JSON.stringify(c))}catch(x){}if(window.spSyncChanged)window.spSyncChanged();draw()});
  addEventListener('spstate',draw);addEventListener('pageshow',draw);draw();
})();
</script>
