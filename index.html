<style>
/* Home: every research page as a tile on one phone screen. */
:root{--bg:#eef0f3;--surface:#fff;--fg:#1b2030;--muted:#5d6577;--line:#d6dae2;--accent:#2e3f6e;--soft:#e1e6f2;--good:#2f7a4f;
  --display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151c;--surface:#1b1f29;--fg:#e6e9f0;--muted:#9aa2b4;--line:#2c3240;--accent:#9db0e6;--soft:#262f47;--good:#6cc493;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--surface:#1b1f29;--fg:#e6e9f0;--muted:#9aa2b4;--line:#2c3240;--accent:#9db0e6;--soft:#262f47;--good:#6cc493;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:13px;line-height:1.4;margin:0;padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:8px;min-height:30px;padding-right:72px}
h1{font-family:var(--display);font-size:17px;margin:0}
.pwa-btn{font:inherit;font-size:11px;font-weight:700;color:var(--surface);background:var(--accent);border:0;border-radius:999px;padding:4px 9px;cursor:pointer}
h2{font-size:11px;font-weight:700;color:var(--muted);margin:4px 2px 0;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.t{position:relative;display:flex;flex-direction:column;justify-content:flex-start;min-height:62px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-decoration:none;color:var(--fg)}
.t:active{transform:scale(.97)}
.t b{font-family:var(--display);font-size:14px;line-height:1.25;word-break:keep-all}
.t span{font-size:10.5px;color:var(--muted);line-height:1.3}
.t em{margin-top:auto;padding-top:2px;font-style:normal;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent)}
.t.wide{grid-column:span 2}
.t.cart{border-color:var(--accent);background:var(--soft)}
.t.full{grid-column:1/-1;min-height:0;flex-direction:row;align-items:baseline;gap:8px}.t.full em{margin-left:auto}
.t .sub{position:relative;z-index:1;align-self:flex-start;margin-top:5px;font-size:10.5px;font-weight:700;color:var(--surface);background:var(--good);border-radius:6px;padding:3px 7px;text-decoration:none}
.t .cover{position:absolute;inset:0;border-radius:12px}
.t:focus-within,.t:hover{border-color:var(--accent)}

<script>
(function(){
  // counts are per person: products on each page minus the ones this person deleted or moved down
  var P=null;
  function st(page,k){try{return JSON.parse(localStorage.getItem('sp:'+(window.spUserNS||'')+page+':'+k)||'{}')}catch(e){return {}}}
  function n(){
    try{var c=JSON.parse(localStorage.getItem('sp:'+(window.spUserNS||'')+'cart')||'{}');document.getElementById('cartn').textContent=Object.keys(c).length}catch(e){}
    if(!P)return;
    document.querySelectorAll('.t[href], .t .cover[href]').forEach(function(a){
      var page=a.getAttribute('href'),ids=P[page];if(!ids)return;
      var del=st(page,'del'),low=st(page,'low');
      var left=ids.filter(function(i){return !del[i]&&!low[i]}).length;
      var em=(a.classList.contains('cover')?a.parentNode:a).querySelector('em');if(em)em.textContent=left;
    });
  }
  fetch('data/pages.json?t='+Math.floor(Date.now()/600000)).then(function(r){return r.json()}).then(function(d){P=d;n()}).catch(function(){});
  n();addEventListener('spcart',n);addEventListener('spstate',n);addEventListener('pageshow',n);
})();
</script>
